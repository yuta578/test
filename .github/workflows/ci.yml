name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend (Express + SQLite) ──────────────────────────────────────
  backend:
    name: Backend – Install & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Usar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      # El backend no tiene tests aún — este paso es un placeholder seguro.
      # Cuando agregues tests (ej. Jest) cambia esto por: npm test
      - name: Verificar que el servidor inicia
        working-directory: backend
        run: node -e "require('./server')" &
        # Nota: el servidor queda en background; el job termina igual.

  # ── Frontend (Vite + React) ─────────────────────────────────────────
  frontend:
    name: Frontend – Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Usar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Build de producción
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
